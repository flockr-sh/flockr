# Start the longest tests first, then the slower integration tests, so the
# short unit tests fill the end of the run instead of a long test.
[[profile.default.overrides]]
filter = 'test(=cases::agents::agent_start_command_works) | test(=federated_client_starts_without_local_and_survives_its_restart)'
priority = 100

[[profile.default.overrides]]
filter = 'test(=machine_api_recovers_a_ping_timeout_without_child_exit_before_one_mutation) | test(=pane_info_and_subscriptions_expose_done_agent_status) | test(=cases::agent_wait::agent_wait_exits_when_done_status_matches) | test(=official_release_waits_for_confirmed_process_exit)'
priority = 50

# Integration tests, plus unit tests that take about a second.
[[profile.default.overrides]]
filter = 'kind(test) | test(/^platform::remote_bridge_tests::/) | test(=server::client_transport::tests::observer_write_timeout_resets_when_sending_makes_progress)'
priority = 20
